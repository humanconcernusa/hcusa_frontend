# Builds the public site and puts it live.
#
# Two doors into one workflow:
#   push               - someone changed code
#   repository_dispatch - the admin published content
#
# Either way the content files are already in the repo by the time this runs, so the build reads
# them and never touches a database.

name: Deploy

on:
  push:
    branches: [production]
    # A publish commits only under content/, and then asks for a build through
    # repository_dispatch. Ignoring content-only pushes here means one publish starts one run,
    # instead of a push run and a dispatch run cancelling each other. A push that also changes
    # code still builds.
    paths-ignore:
      - "content/**"
  repository_dispatch:
    types: [content-published]

# One deploy at a time, and a newer one wins.
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  RELEASE: release-${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Cheaper to stop here than after a deploy: a type error fails the build anyway, just later.
      - run: npm run typecheck

      - run: npm run lint

      # Next bakes these into the exported files, so they must be here at build time.
      - run: npm run build
        env:
          NEXT_PUBLIC_DONATION_API_URL: ${{ vars.DONATION_API_URL }}
          NEXT_PUBLIC_MEDIA_URL: ${{ vars.MEDIA_URL }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ vars.CARTO_API_KEY }}
          NEXT_PUBLIC_CMS_URL: ${{ vars.CMS_URL }}

      # The build must not contain the admin. If it ever does, stop before it goes live.
      - name: No admin in the export
        run: |
          if [ -d out/admin ]; then
            echo "The export contains an admin folder. It should not."
            exit 1
          fi

      # Archive this exact build so rollback can put it back without rebuilding.
      # The keys go straight to aws s3 sync: R2 has no AWS STS, so the credentials action fails.
      - name: Upload the release archive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          bucket="$(printf '%s' "$R2_BUCKET" | tr -d '[:space:]')"
          endpoint="$(printf '%s' "$R2_ENDPOINT" | tr -d '[:space:]')"
          aws s3 sync out "s3://${bucket}/website-releases/${{ env.RELEASE }}/" \
            --endpoint-url "$endpoint"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=production

      - name: Deploy to Vercel
        id: vercel
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_FALLBACK_URL: ${{ vars.VERCEL_URL }}
        run: |
          output="$(npx vercel deploy out --prod --yes --token="$VERCEL_TOKEN_VALUE" 2>&1)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app[^[:space:]]*' | tail -n 1)"
          echo "url=${url:-$VERCEL_FALLBACK_URL}" >> "$GITHUB_OUTPUT"

      # Post-deploy health check. A failure turns the run red; it does not roll back.
      - name: Check the live site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
          VERCEL_URL: ${{ steps.vercel.outputs.url }}
          DONATION_API_URL: ${{ vars.DONATION_API_URL }}
        run: |
          set -uo pipefail

          check() {
            local url="$1"
            local code=""

            for attempt in 1 2 3 4 5 6; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)"
              if [ "$code" = "200" ]; then
                echo "ok   $code  $url"
                return 0
              fi
              sleep 5
            done

            echo "FAIL $code  $url"
            return 1
          }

          failed=0
          paths="/ /about-us /blogs /contact-us /reports /favicon.png /hcu-logo.png"

          site="${SITE_URL:-}"
          if [ -z "$site" ] && [ -n "${PAGES_PROJECT:-}" ]; then
            site="https://${PAGES_PROJECT}.pages.dev"
          fi

          if [ -n "$site" ]; then
            for path in $paths; do
              check "${site%/}$path" || failed=1
            done
          else
            echo "warning: no SITE_URL or CLOUDFLARE_PROJECT, skipping Cloudflare checks"
          fi

          if [ -n "${VERCEL_URL:-}" ]; then
            for path in $paths; do
              check "${VERCEL_URL%/}$path" || failed=1
            done
          else
            echo "warning: no Vercel URL captured, skipping Vercel checks"
          fi

          if [ -n "${DONATION_API_URL:-}" ]; then
            check "${DONATION_API_URL%/}/api/v1/simple-forms" || failed=1
          fi

          exit "$failed"
