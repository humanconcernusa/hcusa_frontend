# Puts an older release back without rebuilding it.
#
# Every deploy is archived in R2 as release-<number>, so a rollback is just: download that folder
# and send it to both hosts again. No checkout, no build, takes seconds.

name: Roll back

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release to put back, for example release-104"
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch the release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          bucket="$(printf '%s' "$R2_BUCKET" | tr -d '[:space:]')"
          endpoint="$(printf '%s' "$R2_ENDPOINT" | tr -d '[:space:]')"
          mkdir -p restored
          aws s3 sync "s3://${bucket}/website-releases/${{ inputs.release }}/" restored \
            --endpoint-url "$endpoint"

      # If the folder is empty the release name was wrong, so stop rather than deploy nothing.
      - name: Check it arrived
        run: |
          if [ ! -f restored/index.html ]; then
            echo "Release ${{ inputs.release }} has no index.html. Check the name."
            exit 1
          fi

      - name: Put it back on Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy restored --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=production

      - name: Put it back on Vercel
        run: npx vercel deploy restored --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
